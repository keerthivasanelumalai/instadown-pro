services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:8080
    restart: unless-stopped
    expose:
      - "3000"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
